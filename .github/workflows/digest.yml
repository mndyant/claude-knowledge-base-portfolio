name: japanese-digest

# 公開版は手動実行のみ。個人運用との二重配信を防ぐ。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # embedding系（torch等）は不要なので、digest専用の軽量依存だけ入れる
      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser tenacity google-genai

      - name: Fetch sources
        run: python scripts/fetch.py

      - name: Build and post digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_CLAUDE: ${{ secrets.DISCORD_WEBHOOK_CLAUDE }}
        run: python scripts/digest.py

      - name: Commit digest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 公開版の.gitignoreは配信状態を追跡しない（git addが失敗する）。
          # この構成では状態が実行間で持ち越されず、毎回「初回実行（投稿なし）」
          # のベースライン初期化になる。実配信する場合は自分のフォークで
          # .gitignoreからdata/digest_state.jsonを外すこと。
          if git check-ignore -q data/digest_state.json; then
            echo "digest state is gitignored; skipping commit"
            exit 0
          fi
          git add data/digest_state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(digest): update digest state [skip ci]"
          git pull --rebase origin main
          git push
