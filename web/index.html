<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Claudeの使い方を、公式出典付きの要約から検索。">
  <title>Claude Knowledge · 出典から探す</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Claude Knowledge ホーム">Claude <span>Knowledge</span></a>
    <nav aria-label="関連リンク">
      <a href="/docs">API</a>
      <a href="https://github.com/mndyant/claude-knowledge-base-portfolio" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>
  </header>
  <main>
    <section class="search-section" aria-labelledby="page-title">
      <p class="eyebrow" id="mode-label">出典付きナレッジ検索</p>
      <h1 id="page-title">Claudeの使い方を、<br class="mobile-break">出典から探す。</h1>
      <p class="intro" id="intro">質問やキーワードから、関連する資料を探します。</p>
      <form id="search-form" class="search-form" role="search">
        <label for="query" class="sr-only">質問・キーワード</label>
        <input id="query" name="q" type="search" maxlength="4000" required autocomplete="off" placeholder="画像をAPIに渡す方法は？">
        <button id="search-button" type="submit">検索</button>
      </form>
      <div class="suggestions" role="group" aria-label="試せる質問">
        <span>試す</span>
        <button type="button" data-query="応答をストリーミングで受け取るには？">ストリーミング</button>
        <button type="button" data-query="画像をAPIに渡す方法は？">画像入力</button>
        <button type="button" data-query="ツールの実行結果をClaudeに返すには？">ツール呼び出し</button>
      </div>
      <details class="advanced" id="advanced-options" hidden>
        <summary>検索オプション</summary>
        <div class="options">
          <label>カテゴリ <select id="category"><option value="">すべて</option><option value="docs">Docs</option><option value="blog">Blog</option><option value="release-notes">Releases</option><option value="status">Status</option></select></label>
          <label>件数 <select id="top-k"><option>5</option><option>10</option><option>20</option></select></label>
          <label><input type="checkbox" id="generate-answer"> 回答も生成（API設定が必要）</label>
        </div>
      </details>
      <p class="scope-note" id="scope-note">検索対象を確認しています…</p>
    </section>
    <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <section class="results-section" aria-labelledby="results-title" aria-busy="false" id="results-section">
      <div class="results-heading" hidden id="results-heading"><h2 id="results-title">検索結果</h2><span id="search-meta"></span></div>
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <article id="answer" class="answer" hidden></article>
      <div id="results" class="results"></div>
    </section>
    <noscript><p>検索にはJavaScriptが必要です。<a href="/docs">Swagger UI</a>からAPIも確認できます。</p></noscript>
  </main>
  <footer><span id="index-status">接続を確認中</span><span>個人制作の非公式アプリ</span></footer>
</body>
</html>
